# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # HWMv2 (Zephyr 4.1): nice_nano_v2 is now nice_nano (default revision 2.0.0)
  # with the zmk board variant. artifact-name keeps the old nice_nano_v2 names
  # so filenames stay stable alongside the firmware/ directory.
  - board: nice_nano//zmk
    shield: skeletyl_left
    artifact-name: skeletyl_left-nice_nano_v2-zmk
  - board: nice_nano//zmk
    shield: skeletyl_right
    artifact-name: skeletyl_right-nice_nano_v2-zmk
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset-nice_nano_v2-zmk
